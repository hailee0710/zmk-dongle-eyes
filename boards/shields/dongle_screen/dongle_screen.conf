CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=n
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# The panel is always SPI, whichever one this module is pointed at, but
# nothing in this module ever actually requested CONFIG_SPI - GPIO, PWM and
# LED all get a `default y` in Kconfig.defconfig, SPI never did. Real builds
# never noticed because their own keyboard shield usually turns SPI on for
# unrelated reasons; a from-scratch standalone build of just this shield
# does not have that luck, and failed to link with the SPI controller device
# undefined. Confirmed by that standalone build, not by inspection.
CONFIG_SPI=y
